    <h1>Fetch User Data</h1>
    <label for="userId">Enter User ID:</label>
    <input type="text" id="userId" placeholder="Enter ID">
    <button id="fetchButton">Fetch Data</button>
    <p id="output"></p>

    <script>
        document.getElementById('fetchButton').addEventListener('click', async () => {
            const userId = document.getElementById('userId').value;
            if (!userId) {
                document.getElementById('output').textContent = 'Please enter a valid User ID.';
                return;
            }

            const url = `https://www.goodreads.com/user/email_signature_destination/${encodeURIComponent(userId)}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.text();
                document.getElementById('output').textContent = data;

                // Save the fetched data into a variable
                const fetchedContent = data;
                console.log('Fetched Content:', fetchedContent);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('output').textContent = 'Error fetching data. Please try again later.';
            }
        });
    </script>
